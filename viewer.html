<title>Training Station 3D</title>
<style>
  :root { --bg:#eef1f3; --ink:#1d2329; --muted:#5a636b; --card:#ffffffee; --line:#c9cdd0; --accent:#0b5cad; --warn:#c62828; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#15191d; --ink:#e8ecef; --muted:#9aa3ab; --card:#1f252bee; --line:#39424a; --accent:#6fb0ff; --warn:#ff6b6b; } }
  :root[data-theme="dark"] { --bg:#15191d; --ink:#e8ecef; --muted:#9aa3ab; --card:#1f252bee; --line:#39424a; --accent:#6fb0ff; --warn:#ff6b6b; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; overflow:hidden; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  .bar { position:fixed; left:12px; right:12px; top:12px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; pointer-events:none; }
  .title { pointer-events:auto; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 12px; font-weight:700; font-size:14px; line-height:1.25; }
  .title small { display:block; font-weight:500; color:var(--muted); font-size:11.5px; }
  .btns { pointer-events:auto; display:flex; flex-wrap:wrap; gap:6px; }
  button { font:inherit; font-size:13px; font-weight:600; padding:8px 12px; border-radius:9px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
  button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .ctl { position:fixed; left:12px; bottom:12px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 12px; font-size:12.5px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; max-width:calc(100% - 48px); }
  .ctl input[type=range] { width:130px; }
  #tip { position:fixed; right:12px; bottom:12px; max-width:min(380px, calc(100% - 48px)); background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; font-size:13px; display:none; box-shadow:0 6px 24px #0002; }
  #tip b { font-size:14px; } #tip .pn { color:var(--accent); font-weight:700; } #tip .m { color:var(--muted); }
  #tip .lo { color:var(--warn); font-weight:700; } #tip .src { display:inline-block; margin-top:4px; padding:1px 7px; border-radius:6px; border:1px solid var(--line); font-size:11.5px; font-weight:700; }
  #load { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 14px; font-size:13px; }
  .draft { position:fixed; right:12px; top:12px; font-size:11px; font-weight:800; color:var(--warn); background:var(--card); border:1px solid var(--line); border-radius:8px; padding:5px 8px; }
  body.still .bar, body.still .ctl, body.still #tip, body.still #load { display:none; }
  body.still .draft { top:auto; bottom:10px; right:12px; font-size:10px; font-weight:700; color:#9aa0a6; background:none; border:none; padding:0; letter-spacing:.06em; }
  html, body { background:#ffffff; }
  @media (max-width: 640px) { .title { font-size:13px; } button { padding:7px 10px; font-size:12px; } .draft { top:auto; bottom:96px; } .ctl input[type=range] { width:90px; } }
</style>
</head>

}
